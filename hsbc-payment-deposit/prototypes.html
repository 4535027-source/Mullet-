<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>汇丰银行 · 支付管理</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font:14px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#262626}body{display:flex;flex-direction:column;background:#f5f6f8}header{background:white;border-bottom:1px solid #e6e8ed;display:flex;align-items:center;gap:24px;padding:12px 24px;flex-wrap:wrap}h1{font-size:16px;margin:0}nav{display:flex;background:#f3f4f7;border-radius:9px;padding:4px;gap:4px}button{font:inherit;background:transparent;border:0;border-radius:6px;padding:9px 18px;cursor:pointer;color:#666}button[aria-selected=true]{color:#2445ff;background:white;box-shadow:0 1px 5px #0001;font-weight:600}button:focus-visible{outline:2px solid #2445ff}small{margin-left:auto;color:#999}main{flex:1;min-height:0;position:relative}iframe{width:100%;height:100%;border:0;display:block;background:#f7f7f8}iframe[hidden]{display:none}@media(max-width:600px){header{padding:12px;gap:12px}h1{font-size:15px}small{display:none}nav{width:100%}button{flex:1}}</style></head><body><header><h1>汇丰银行 · 支付管理</h1><nav role="tablist" aria-label="页面导航"><button id="channel-tab" role="tab" aria-selected="true" aria-controls="channel">支付渠道管理</button><button id="deposit-tab" role="tab" aria-selected="false" aria-controls="deposit" tabindex="-1">银行卡入金</button></nav></header><main><iframe id="channel" role="tabpanel" aria-labelledby="channel-tab" title="支付渠道管理" src="index.html"></iframe><iframe id="deposit" role="tabpanel" aria-labelledby="deposit-tab" title="银行卡入金" src="deposit.html" hidden></iframe></main><script>const tabs=[...document.querySelectorAll('[role=tab]')];function select(id){tabs.forEach(t=>{const on=t.id===id+'-tab';t.setAttribute('aria-selected',String(on));t.tabIndex=on?0:-1;document.getElementById(t.getAttribute('aria-controls')).hidden=!on});history.replaceState(null,'','#'+id)}tabs.forEach((t,i)=>{t.onclick=()=>select(t.getAttribute('aria-controls'));t.onkeydown=e=>{if(['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const n=e.key==='Home'?0:e.key==='End'?1:1-i;tabs[n].click();tabs[n].focus()}}});if(location.hash==='#deposit')select('deposit');</script><!-- 返回原型导航首页按钮（在 iframe 内嵌或 ?embed=1 时自动隐藏） -->
<a id="protoHomeBtn" href="/" title="返回原型导航首页" style="position:fixed;left:16px;bottom:16px;z-index:9999;display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:#1f2329;color:#fff;font:13px/1.2 -apple-system,'PingFang SC','Microsoft YaHei',sans-serif;text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,.18);opacity:.88">← 原型导航</a>
<script>(function(){var b=document.getElementById('protoHomeBtn');if(!b)return;var e=false;try{e=window.top!==window.self}catch(x){e=true}if(e||new URLSearchParams(location.search).get('embed')==='1')b.style.display='none';b.onmouseenter=function(){b.style.opacity='1'};b.onmouseleave=function(){b.style.opacity='.88'}})();</script>
</body></html>
