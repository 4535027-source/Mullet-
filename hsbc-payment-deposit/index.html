<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>支付渠道管理</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f7f8;color:#262626;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}header{height:85px;display:flex;align-items:center;gap:17px;padding:16px 24px;border-bottom:1px solid #e5e5e5;background:#f8fbfd}h1{font-size:20px;margin:0}.logo{width:54px;height:53px;border:1px solid #e3e3e3;border-radius:13px;background:white;display:grid;place-items:center;font-size:27px}.tag{margin-left:auto;color:#999;font-size:12px}main{padding:20px}.toolbar{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap}input,select,textarea{font:inherit;color:#333;border:1px solid #e9e9ec;border-radius:8px;background:white;padding:9px 11px;outline:none;width:100%;height:40px}input:focus,select:focus,textarea:focus{border-color:#435cff;box-shadow:0 0 0 2px #2445ff10}input::placeholder{color:#bfbfbf}input:disabled,select:disabled{background:#f6f7f9;color:#b9bbc0}.toolbar input{width:190px;height:33px}.toolbar select{width:180px;height:33px;padding:4px 10px}button{font:inherit;cursor:pointer;border:1px solid #e9e9ec;border-radius:7px;padding:7px 15px;background:white;color:#333}button:hover{border-color:#2445ff;color:#2445ff}.primary{background:#203dff;color:#fff;border-color:#203dff}.primary:hover{background:#405aff;color:white}.add{margin-left:auto}.card{border:1px solid #ededee;border-radius:17px;background:white;padding:16px;overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap;text-align:left;font-size:14px}th{background:#fafafa;font-weight:600;padding:15px 20px;border-bottom:1px solid #e9e9eb}td{padding:15px 20px}tbody tr:nth-child(even){background:#fafafa}tbody tr:hover{background:#f5f7ff}.link{background:none;border:0;color:#315bff;padding:0 10px}.dot:before{content:'•';color:#00bba5;margin-right:8px;font-size:18px}.off:before{color:#aaa}.muted{color:#a0a0a0}.empty{text-align:center;padding:40px;color:#999}dialog{border:0;border-radius:10px;padding:24px;width:880px;max-width:calc(100vw - 40px);max-height:95vh;box-shadow:0 16px 45px #0002;color:#262626}dialog::backdrop{background:#0006}.modal-title{font-size:16px;font-weight:600;margin:0 0 12px}.close{position:absolute;right:16px;top:12px;background:none;border:0;font-size:24px;color:#999;padding:3px 8px}.section{font-size:16px;font-weight:600;margin:12px 0 23px;display:flex;align-items:center;gap:8px}.section:before{content:'';width:4px;height:16px;border-radius:2px;background:#233eff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:25px 24px;margin-bottom:32px}label{display:block;margin-bottom:11px}.req:before{content:'* ';color:#ff4d4f}.hint{font-size:13px;color:#999;margin-top:4px}.footnote{font-size:12px;color:#888;line-height:1.5;margin:20px 0 12px}.footer{display:flex;justify-content:flex-end;gap:8px}.error{color:#e64747;margin:12px 0}.toast{position:fixed;top:25px;left:50%;transform:translateX(-50%);padding:12px 22px;background:white;box-shadow:0 4px 22px #0002;border-radius:8px;z-index:9} [hidden]{display:none!important}@media(max-width:650px){.grid{grid-template-columns:1fr;gap:18px}.tag{display:none}.add{margin-left:0}dialog{padding:20px}.card{padding:10px}main{padding:12px}}
</style><header><div class="logo">💹</div><h1>支付渠道管理</h1></header><main><form class="toolbar" id="search"><input id="codeQuery" placeholder="渠道编码" aria-label="查询渠道编码"><input id="nameQuery" placeholder="渠道名称" aria-label="查询渠道名称"><select id="statusQuery" aria-label="渠道状态"><option value="">渠道状态</option><option>启用</option><option>停用</option></select><button class="primary">⌕ 查询</button><button type="button" id="reset">♧ 重置</button><button type="button" class="primary add" id="add">＋ 新增渠道</button></form><div class="card"><table><thead><tr><th>排序</th><th>渠道编码</th><th>渠道名称</th><th>通道类型</th><th>需要KYC</th><th>入金区间</th><th>入金配置状态</th><th>出金区间</th><th>出金配置状态</th><th>出金服务费比例</th><th>最后更新时间</th><th>渠道状态</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div></main><dialog id="modal"><button class="close" id="close" aria-label="关闭">×</button><h2 class="modal-title" id="title"></h2><form id="edit"><div class="section">渠道基础信息</div><div class="grid" id="base"></div><div class="section">法币出入金配置</div><div class="grid" id="config"></div><div class="error" id="error" role="alert" hidden></div><div class="footer"><button type="button" id="cancel">取消</button><button class="primary" id="save">确定</button></div></form></dialog><div class="toast" id="toast" hidden role="status">保存成功</div><script>
const initial=[{code:'mulletpay',name:'MulletPay',type:'Crypto',kyc:'是',status:'启用',sort:-1,min:10,max:100,withdrawMin:10,withdrawMax:100,fee:0,deposit:'开启',withdraw:'开启',note:'',updated:'2026-10-16 15:44:34'},{code:'TRADING365',name:'Trading365',type:'法币',kyc:'是',status:'启用',sort:0,min:100,max:21000,withdrawMin:5,withdrawMax:21000,fee:0,deposit:'开启',withdraw:'开启',note:'法币通道trading365-测试',updated:'2026-11-19 11:00:00'},{code:'汇丰银行',name:'汇丰银行',type:'法币',kyc:'是',status:'启用',sort:1,min:10,max:1000,withdrawMin:'',withdrawMax:'',fee:'',deposit:'开启',withdraw:'关闭',note:'',updated:'—'}];
const $=id=>document.getElementById(id),key='hsbc-payment-prototype-v1';let data=initial;try{const saved=JSON.parse(localStorage.getItem(key));if(Array.isArray(saved)&&saved.length)data=saved}catch{}let active=-1;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const range=(a,b)=>a===''||b===''?'未配置':esc(a)+' ~ '+esc(b);const status=s=>`<span class="dot ${['关闭','停用'].includes(s)?'off':''}">${esc(s)}</span>`;
function render(){const found=data.map((r,i)=>({...r,i})).filter(r=>r.code.toLowerCase().includes($('codeQuery').value.trim().toLowerCase())&&r.name.toLowerCase().includes($('nameQuery').value.trim().toLowerCase())&&(!$('statusQuery').value||r.status===$('statusQuery').value)).sort((a,b)=>a.sort-b.sort);$('rows').innerHTML=found.map(r=>`<tr><td>${r.sort}</td><td>${esc(r.code)}</td><td>${esc(r.name)}</td><td>${esc(r.type)}</td><td>${esc(r.kyc)}</td><td>${range(r.min,r.max)}</td><td>${status(r.deposit)}</td><td>${range(r.withdrawMin,r.withdrawMax)}</td><td>${status(r.withdraw)}</td><td>${r.fee===''?'未配置':esc(r.fee)+'%'}</td><td>${esc(r.updated)}</td><td>${status(r.status)}</td><td><button class="link" data-id="${r.i}" data-mode="view">详情</button><button class="link" data-id="${r.i}" data-mode="edit">编辑</button></td></tr>`).join('')||'<tr><td class="empty" colspan="13">暂无匹配渠道</td></tr>'}
const fields=[['code','渠道编码','text',true],['name','渠道名称','text',true],['type','通道类型',['法币','Crypto'],true],['kyc','需要KYC',['是','否'],true],['status','渠道状态',['启用','停用'],true],['sort','排序（越小越靠前）','number',false],['note','备注','text',false]];const configs=[['min','最低入金数量','number',true],['max','最高入金金额','number',true],['withdrawMin','最低出金数量','number',false],['withdrawMax','最高出金数量','number',false],['fee','出金服务费比例（%）','number',false],['blank'],['deposit','入金配置状态',['开启','关闭'],true],['withdraw','出金配置状态',['开启','关闭'],true]];
function openModal(index,view=false){active=index;const r=index<0?{code:'',name:'',type:'法币',kyc:'是',status:'启用',sort:1,min:10,max:1000,withdrawMin:'',withdrawMax:'',fee:'',deposit:'开启',withdraw:'关闭',note:''}:data[index];$('title').textContent=index<0?'新增渠道':`${view?'渠道详情':'编辑渠道'} · ${r.code}`;function field([id,label,kind,req]){if(id==='blank')return '<div></div>';const disabled=view||(index>=0&&['code','type'].includes(id)),attrs=`id="f_${id}" name="${id}" ${req?'required':''} ${disabled?'disabled':''}`;return `<div><label for="f_${id}" class="${req?'req':''}">${label}</label>${Array.isArray(kind)?`<select ${attrs}>${kind.map(v=>`<option ${r[id]===v?'selected':''}>${v}</option>`).join('')}</select>`:`<input ${attrs} type="${kind}" value="${esc(r[id])}" ${kind==='number'?`step="${id==='sort'?'1':'any'}" ${id==='sort'?'':'min="0"'} ${id==='fee'?'max="100"':''}`:''} placeholder="${['withdrawMin','withdrawMax','fee'].includes(id)?'未配置':'请输入'+label}">`}${id==='fee'?'<div class="hint">入库值 = 比例 / 100（0.010000 表示 1%）</div>':''}</div>`} $('base').innerHTML=fields.map(field).join('');$('config').innerHTML=configs.map(field).join('');$('save').hidden=view;$('cancel').textContent=view?'关闭':'取消';$('error').hidden=true;$('modal').showModal()}
$('rows').onclick=e=>{const b=e.target.closest('button');if(b)openModal(Number(b.dataset.id),b.dataset.mode==='view')};$('add').onclick=()=>openModal(-1);$('close').onclick=$('cancel').onclick=()=>$('modal').close();$('search').onsubmit=e=>{e.preventDefault();render()};$('reset').onclick=()=>{$('search').reset();render()};$('edit').onsubmit=e=>{e.preventDefault();const r={};for(const [id,,kind]of [...fields,...configs]){if(id==='blank')continue;const v=$('f_'+id).value.trim();r[id]=kind==='number'&&v!==''?Number(v):v}let error='';if(!r.code||!r.name)error='请填写渠道编码和渠道名称';else if(data.some((d,i)=>i!==active&&d.code===r.code))error='渠道编码已存在，请使用其他编码';else if(r.min>r.max)error='最低入金数量不能大于最高入金金额';else if((r.withdrawMin==='')!==(r.withdrawMax===''))error='请同时填写最低和最高出金数量';else if(r.withdrawMin!==''&&r.withdrawMin>r.withdrawMax)error='最低出金数量不能大于最高出金数量';else if(r.withdraw==='开启'&&(r.withdrawMin===''||r.withdrawMax===''||r.fee===''))error='开启出金前，请填写出金区间和服务费比例';if(error){$('error').textContent=error;$('error').hidden=false;return}r.updated=new Date().toLocaleString('sv-SE',{timeZone:'Asia/Shanghai'});if(active<0)data.push(r);else data[active]=r;let persisted=true;try{localStorage.setItem(key,JSON.stringify(data))}catch{persisted=false}render();$('modal').close();$('toast').textContent=persisted?'保存成功':'已更新；浏览器未允许持久保存';$('toast').hidden=false;setTimeout(()=>$('toast').hidden=true,2500)};render();
</script></html>
