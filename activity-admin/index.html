const stamp=s=>new Date(s.replace(' ','T')+'+08:00').getTime(),dateTime=ms=>new Date(ms+8*3600000).toISOString().slice(0,19).replace('T',' '),plusDays=(s,d)=>dateTime(stamp(s)+d*86400000);
const NOW='2026-12-03 15:00:00';const LIMITS=[100,500,1000,2000,5000,10000];const RATIOS=[.06,.09,.12,.18,.24,.30];const products=[['XAUUSD',33],['XAGUSD',280],['XAUCNH',118.06],['UKOIL',84],['USOIL',58],['US500',50.5],['JPN225',62.1],['HK50',81],['NAS100',62],['US30',61],['GER30',47.92]];
let cfg={name:'首充赠金活动',start:'2026-12-01',end:'2027-03-31',notes:'首次成功入金起24小时内累计有效入金，窗口结束后按达到的最高档位锁定。窗口内合格交易按锁定档位补算，定档后每天汇总发放一次。赠金总额为24小时累计入金的200%，最高20,000 USD；剩余待释放额度不可作为保证金，返佣实际到账后计为已发放。'},page='list',detailTab=0,userId=null,userTab='daily',q={list:'',user:'',state:'全部',payUser:'',payDate:''};

// Pay at 09:00 after the later of final tier lock and the next midnight following close.
// 09:00 is a prototype proposal; daily frequency is confirmed.
function runAfter(t){let d=t.slice(0,10)+' 09:00:00';return stamp(d)>=stamp(t)?d:plusDays(d,1)}
function paidAt(t,lock){let next=plusDays(t.close.slice(0,10)+' 00:00:00',1);return runAfter(stamp(lock)>stamp(next)?lock:next)}
function tierFor(amount){let n=0;LIMITS.forEach((v,i)=>{if(amount>=v)n=i+1});return n}
function profile(id){let p=people.find(p=>p.id===id),lock=plusDays(p.first,1),closed=stamp(NOW)>=stamp(lock);let ins=deposits.filter(d=>d.user===id&&d.state==='成功'&&stamp(d.time)>=stamp(p.first)&&stamp(d.time)<stamp(lock)&&stamp(d.time)<=stamp(NOW));let amount=ins.reduce((n,d)=>n+d.amount,0),level=tierFor(amount);return {...p,lock,closed,amount,level,pool:closed?(level?Math.min(amount*2,20000):0):null,end:plusDays(p.first,90),state:closed?(level?'已定档':'未达门槛'):'累计入金中'}}
function settledPeople(){return people.map(p=>profile(p.id)).filter(p=>p.closed&&p.state==='已定档'&&p.level>0)}
function fee(symbol,level){return level?Math.floor(products.find(p=>p[0]===symbol)[1]*RATIOS[level-1]+.5):0}
function allocations(id){let p=profile(id);let remaining=p.pool;return trades.filter(t=>t.user===id&&stamp(t.close)<=stamp(NOW)&&stamp(t.open)>=stamp(p.first)&&stamp(t.close)<stamp(p.end)&&(stamp(t.close)-stamp(t.open)>=60000)).sort((a,b)=>stamp(a.close)-stamp(b.close)||a.id.localeCompare(b.id)).map(t=>{let rate=p.closed&&p.level?fee(t.symbol,p.level):null,raw=rate===null?null:t.lots*rate,amount=raw===null?null:Math.max(0,Math.min(raw,remaining));if(amount!==null)remaining-=amount;let at=rate!==null?paidAt(t,p.lock):null;return {...t,level:p.closed?p.level:null,rate,amount,at,backfill:stamp(t.close)<stamp(p.lock),state:rate===null?'待定档':stamp(at)<=stamp(NOW)?'已发放':'待发放'}})}
function payouts(){let groups=new Map;people.forEach(p=>allocations(p.id).filter(t=>t.amount>0).forEach(t=>{let key=p.id+'_'+t.at.slice(0,10);if(!groups.has(key))groups.set(key,{id:'PAY-'+key,user:p.id,time:t.at,rows:[],state:t.state});groups.get(key).rows.push(t)}));return [...groups.values()].map(g=>({...g,amount:Math.round((g.rows.reduce((n,t)=>n+t.amount,0)+Number.EPSILON)*100)/100,lots:g.rows.reduce((n,t)=>n+t.lots,0),dates:[...new Set(g.rows.map(t=>t.close.slice(0,10)))],backfill:g.rows.some(t=>t.backfill)})).sort((a,b)=>b.time.localeCompare(a.time)||a.user.localeCompare(b.user))}
function totals(id){let ts=allocations(id),ps=payouts().filter(p=>p.user===id),p=profile(id);return {paid:ps.filter(x=>x.state==='已发放').reduce((n,x)=>n+x.amount,0),pending:ps.filter(x=>x.state==='待发放').reduce((n,x)=>n+x.amount,0),remaining:p.pool===null?null:Math.max(0,p.pool-ts.reduce((n,t)=>n+(t.amount||0),0)),lots:ts.filter(t=>t.amount>0).reduce((n,t)=>n+t.lots,0)}}

function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>$('#toast').style.display='none',2500)}function badge(s){return `<span class="badge ${['正常','已定档','已发放','进行中'].includes(s)?'green':['累计入金中','待定档','待发放'].includes(s)?'orange':'gray'}">${s}</span>`}function note(t){return `<div class="notice">${t}</div>`}function table(h,rs){return `<div class="tablewrap"><table><thead><tr>${h.map(v=>`<th>${v}</th>`).join('')}</tr></thead><tbody>${rs.length?rs.map(r=>`<tr>${r.map(v=>`<td>${v}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${h.length}" class="empty">暂无记录</td></tr>`}</tbody></table></div>`}function title(t,actions=''){return `<div class="crumb">运营管理 / 活动明细${page==='list'?'':' / '+t}</div><div class="titlebar"><div><h1>${t}</h1><span class="muted">第一版 · 仅首充活动</span></div><div class="actions">${actions}</div></div>`}function closeLayer(){$('#layer').innerHTML='';userId=null}function roundLots(v){return Number(v.toFixed(8))}function field(n,body,help=''){return `<div class="field"><label>${n}</label>${body}<p>${help}</p></div>`}

if(tab===1)b=`<h3>首充参与与累计入金</h3><div class="steps"><div class="step">01　首次成功入金<br><br>自动开始24小时累计窗口</div><div class="step">02　窗口内继续入金<br><br>累计有效入金金额</div><div class="step">03　满24小时<br><br>锁定档位，后续入金不升档</div></div>${table(['规则','口径'],[['起算时间','首次成功外部入金到账时间，不按自然日'],['累计范围','[首次成功入金时间，满24小时)，恰好截止时到账的入金不计入'],['最低档位','窗口内累计≥100美元；第一笔可不足100美元'],['档位','按24小时累计金额达到的最高档锁定；不是所有用户都按L6'],['窗口结束仍不足100美元','不生成本次活动赠金额度；是否可另行取得参与资格，按最终参与规则配置'],['入金金额来源','建议采用成功到账本金的美元金额，排除奖励补贴、内部划转；待核实'],['重复参与','建议每实名身份一次，绑定一个活动交易账户']])}`;
if(tab===2)b=`<h3>赠金与返佣规则</h3><div class="grid2">${field('赠金总额','<input disabled value="24小时累计有效入金 × 200%，最高20,000 USD">','按原200%赠金规则衔接累计入金，窗口结束后确定总额。')}${field('个人有效期','<input disabled value="90天">','示例沿用首次成功入金起算90天，起算点仍待最终确认。')}${field('持仓条件','<input disabled value="≥60秒">','保留计奖校验，交易明细不再展示持仓时长列。')}${field('发放频率','<input disabled value="定档后每位用户每天汇总发放一次">','时间示例为UTC+8每日09:00，具体执行时刻待确认。')}</div>${table(['档位','24小时累计入金（D）','XAUUSD每手返佣金额（USD/标准手）'],[['L1','100≤D<500','$2'],['L2','500≤D<1,000','$3'],['L3','1,000≤D<2,000','$4'],['L4','2,000≤D<5,000','$6'],['L5','5,000≤D<10,000','$8'],['L6','D≥10,000','$10']])}<div class="titlebar" style="margin-top:22px"><h3>商品与股指费率</h3><button onclick="showRates()">查看费率表</button></div>${note('窗口内合格交易暂存，定档后按锁定档位统一补算。首次日结合并未发放的历史交易与当期交易，可查看对应交易；同一用户同一发放日只生成一笔发放记录。')}<div class="card" style="background:#f8faff"><h3>定档与返佣试算</h3><div class="filters"><input id="calcDeposit" type="number" value="1000" oninput="calc()"><span class="muted">24小时累计入金USD</span><select id="calcSymbol" onchange="calc()">${products.map(p=>`<option>${p[0]}</option>`).join('')}</select><input id="calcLots" type="number" value="1" step="0.01" oninput="calc()"><span class="muted">平仓手数</span></div><div id="calcOut"></div></div>`;
if(tab===3)b=`<h3>活动规则说明</h3><textarea style="width:100%;min-height:150px;padding:14px;font:inherit;border:1px solid #dce3ec;border-radius:5px;line-height:1.8" onchange="cfg.notes=this.value">${esc(cfg.notes)}</textarea><h3 style="margin-top:24px">每日发放口径</h3>${table(['项目','规则'],[['定档前','仅累计入金与暂存交易，不生成已确认返佣金额，不提前到账'],['定档后','窗口内交易与后续合格交易，均使用锁定档位的品种费率'],['发放归属','定档后按日汇总一人一笔，首次可含历史补算；待发放显示计划日期，已发放显示实际日期'],['首次日结示例','12月2日10点定档，已错过当天09点批次；12月3日09点发放12月1、2日应发金额'],['资金核对','正常参与且未发生取消、到期扣回或冲正时：赠金总额 = 已发放 + 待发放 + 剩余待释放；待发放预占额度'],['失败重试','沿用原发放单重试，不新增奖励、不重复扣减赠金'],['金额精度','整数每手费率 × 实际平仓手数；日汇总到美分，不逐笔取整到美元'],['未定事项','提现取消规则、未达门槛后续入金处理、个人90天起算点及每日执行时刻']])}<p class="muted">删除“失效额度／状态”和“持仓时长”的展示，不等于取消后台原有资格、到期与持仓校验。交易冲正与退款继续沿用原资金处理流程。</p>`;$('#editBody').innerHTML=b;if(tab===2)calc()}
function save(){if(!cfg.name.trim()||!cfg.start||!cfg.end||cfg.start>cfg.end){toast('请填写有效名称及活动日期');return}toast('草稿已保存在当前页面内存，刷新恢复模拟配置')}
function calc(){let d=Number($('#calcDeposit').value),v=Number($('#calcLots').value);if(!Number.isFinite(d)||!Number.isFinite(v)||d<0||v<0){$('#calcOut').textContent='请输入非负金额与手数';return}let level=tierFor(d),pool=level?Math.min(d*2,20000):0,rate=fee($('#calcSymbol').value,level);$('#calcOut').innerHTML=`<div class="chips"><span class="chip">${level?'档位 L'+level:'未达100美元门槛'}</span><span class="chip">赠金总额 ${money(pool)}</span><span class="chip">每手 ${money(rate)}</span><span class="chip">本次计算 ${money(Math.min(v*rate,pool))}</span></div><p class="muted">假设已满24小时、交易符合条件且赠金尚未消耗。窗口内合格交易也按该档位补算。</p>`}
function showRates(){$('#layer').innerHTML=`<div class="overlay"><div class="drawer" style="width:min(1000px,96vw)"><div class="titlebar"><h1>首充返佣费率</h1><button onclick="closeLayer()">关闭</button></div><div class="card">${table(['品种代码','点差金额（USD/标准手）','L1','L2','L3','L4','L5','L6','说明'],products.map(([s,v])=>[s,v,...RATIOS.map(r=>Math.floor(v*r+.5)),'上线前核验']))}</div></div></div>`}
function details(tab=0){page='details';detailTab=tab;let ps=payouts(),paid=ps.filter(p=>p.state==='已发放');$('#app').innerHTML=title('活动详情',`<button onclick="list()">返回</button><button onclick="edit(2)">编辑规则</button>`)+`<div class="card"><div class="titlebar"><strong>${esc(cfg.name)}</strong><span class="badge gray">模拟时点：${NOW} · UTC+8</span></div><div class="sectiontabs">${['参与用户','奖励发放列表'].map((n,i)=>`<button class="${tab===i?'sel':''}" onclick="details(${i})">${n}</button>`).join('')}</div><div class="filters" style="gap:28px"><span>参与用户 <strong>${settledPeople().length}</strong></span><span>累计交易手数 <strong>${roundLots(settledPeople().reduce((sum,p)=>sum+totals(p.id).lots,0))}手</strong></span><span>已发放 <strong>${money(paid.reduce((n,p)=>n+p.amount,0))}</strong></span><span>待发放 <strong>${money(ps.filter(p=>p.state==='待发放').reduce((n,p)=>n+p.amount,0))}</strong></span></div><div id="detailContent"></div></div>`;renderDetail()}
function renderDetail(){if(detailTab===0){$('#detailContent').innerHTML=`<div class="filters"><input id="userQ" placeholder="用户ID" value="${esc(q.user)}"><button class="primary" onclick="q.user=$('#userQ').value;renderDetail()">查询</button><button onclick="q.user='';q.state='全部';renderDetail()">重置</button></div>`+table(['用户ID','24小时累计入金','定档时间','档位','累计交易手数','赠金总额','已发放','待发放','剩余待释放','状态','操作'],settledPeople().filter(p=>p.id.includes(q.user)).map(p=>{let t=totals(p.id);return[p.id,money(p.amount),p.lock,p.closed?'L'+p.level:`<span class="muted">预估 L${p.level}</span>`,roundLots(t.lots)+'手',p.pool===null?'—':money(p.pool),money(t.paid),p.closed?money(t.pending):'待定档',t.remaining===null?'—':money(t.remaining),badge(p.activityStatus),`<button class="link" onclick="personDetail('${p.id}')">用户明细</button><button class="link" style="color:#ff4d4f" onclick="explainExisting('奖励停止发放')">奖励停止发放</button><button class="link" style="color:#ff4d4f" onclick="explainExisting('禁止参与')">禁止参与</button>`]}))+`<p class="notefoot">仅展示首次成功入金满24小时且已完成定档的用户，未定档用户不展示。累计交易手数为本活动已计入返佣的平仓手数，含已发放与待发放部分；上方为全部参与用户合计。定档后不再升级；剩余待释放不包含已确认的待发放金额。</p>`}else{let rs=payouts().filter(p=>p.user.includes(q.payUser)&&(!q.payDate||p.time.slice(0,10)===q.payDate));$('#detailContent').innerHTML=`<div class="filters"><input id="payQ" placeholder="用户ID" value="${esc(q.payUser)}"><input id="payDate" type="date" value="${q.payDate}"><button class="primary" onclick="q.payUser=$('#payQ').value;q.payDate=$('#payDate').value;renderDetail()">查询</button><button onclick="q.payUser='';q.payDate='';renderDetail()">重置</button></div>`+table(['用户ID','发放日期','交易手数','返佣金额','发放状态','操作'],rs.map(p=>[p.user,p.time.slice(0,10),roundLots(p.lots),money(p.amount),badge(p.state),`<button class="link" onclick="payDetail('${p.id}')">交易明细</button>`]))+`<p class="notefoot">定档后按用户每日汇总；已发放记录显示实际日期，待发放记录显示计划日期。首次发放可能包含窗口内多日补算；发放时间示例为每日09:00，具体时刻待确认。</p>`}}
function transactionTable(ts){return table(['平仓单号','关联持仓单号','品种代码','开仓时间','平仓时间','平仓手数','档位','每手返佣金额','返佣金额'],ts.map(t=>[t.id,t.pos,t.symbol,t.open,t.close,t.lots+'手',t.level?'L'+t.level:'待定档',t.rate===null?'待定档':money(t.rate),t.amount===null?'待定档':money(t.amount)]))}
function personDetail(id,tab='daily',payoutId=''){userId=id;userTab=tab;let p=profile(id),t=totals(id);$('#layer').innerHTML=`<div class="overlay"><div class="drawer" style="width:min(1400px,96vw)"><div class="titlebar"><div><h1>用户明细 · ${id}</h1><span class="muted">首充赠金活动</span></div><button onclick="closeLayer()">关闭</button></div><div class="card"><h3>赠金情况</h3><div class="grid2"><div class="kv"><span>24小时累计入金</span><strong>${money(p.amount)}</strong><span>档位</span><span>L${p.level}</span><span>赠金总额</span><span>${p.pool===null?'定档后确定':money(p.pool)}</span><span>已发放 / 待发放</span><span>${money(t.paid)} / ${p.closed?money(t.pending):'待定档'}</span><span>剩余待释放</span><span>${t.remaining===null?'定档后确定':money(t.remaining)}</span></div><div class="kv"><span>首次成功入金时间</span><span>${p.first}</span><span>定档时间</span><span>${p.lock}</span><span>个人有效期至</span><span>${p.end}</span><span>累计交易手数</span><span>${p.closed?roundLots(t.lots)+'手':'定档后统计'}</span></div></div></div><div class="card"><div class="sectiontabs">${[['daily','每日返佣'],['trades','交易明细']].map(([k,n])=>`<button class="${tab===k?'sel':''}" onclick="personDetail('${id}','${k}')">${n}</button>`).join('')}</div><div id="userBody"></div></div></div></div>`;let body='';if(tab==='daily'){let ps=payouts().filter(g=>g.user===id);body=table(['发放日期','交易手数','返佣金额','发放状态','操作'],ps.map(g=>[g.time.slice(0,10),roundLots(g.lots)+'手',money(g.amount),badge(g.state),`<button class="link" onclick="payDetail('${g.id}','${id}')">交易明细</button>`]));body+=`<p class="muted">定档后每天汇总发放一次；首次发放合并尚未发放的补算金额与当期应发金额。</p>`}if(tab==='trades')body=tradeView(id,payoutId);$('#userBody').innerHTML=body}
function tradeView(id,payoutId='',filters={}){
 let selected=payouts().find(g=>g.user===id&&g.id===payoutId);
 let rows=selected?selected.rows:allocations(id).filter(t=>t.amount>0);
 let {start='',end='',order=''}=filters;
 rows=rows.filter(t=>(!start||t.close.slice(0,10)>=start)&&(!end||t.close.slice(0,10)<=end)&&(!order||t.id===order));
 let lots=rows.reduce((n,t)=>n+t.lots,0),amount=rows.reduce((n,t)=>n+t.amount,0);
 return `${selected?`<div class="filters"><button onclick="personDetail('${id}','trades')">查看全部交易</button></div>`:''}<div class="filters"><label for="tradeStart">平仓时间</label><input id="tradeStart" type="date" value="${esc(start)}" aria-label="平仓开始日期"><span>至</span><input id="tradeEnd" type="date" value="${esc(end)}" aria-label="平仓结束日期"><label for="tradeOrder">平仓单号</label><input id="tradeOrder" placeholder="请输入完整平仓单号" value="${esc(order)}"><button class="primary" onclick="filterTrades('${id}','${payoutId}')">查询</button><button onclick="resetTrades('${id}','${payoutId}')">重置</button></div><div class="filters"><span>筛选结果交易手数：<strong>${roundLots(lots)}手</strong></span><span>返佣金额：<strong>${money(amount)}</strong></span></div>${transactionTable(rows)}<p class="muted">平仓时间按日期筛选，包含起止日全天（UTC+8）；平仓单号按完整单号精确匹配。每行对应一笔平仓成交。</p>`;
}
function filterTrades(id,payoutId){let start=$('#tradeStart').value,end=$('#tradeEnd').value,order=$('#tradeOrder').value.trim();if(start&&end&&start>end){toast('开始日期不能晚于结束日期');return}$('#userBody').innerHTML=tradeView(id,payoutId,{start,end,order})}
function resetTrades(id,payoutId){$('#userBody').innerHTML=tradeView(id,payoutId)}
