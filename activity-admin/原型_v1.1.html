if(configTab===3)b=`<div class="grid2"><div><h3>被邀请人本人奖励</h3><div class="kv"><span>收款人</span><strong>交易者本人</strong><span>有效期</span><strong>30天</strong><span>目标比例</span><strong>点差基数S × 6%</strong><span>黄金每手费率</span><strong>$2</strong></div></div><div><h3>直接邀请人奖励</h3><div class="kv"><span>收款人</span><strong>直接邀请人</strong><span>有效期</span><strong>按每名好友分别计算60天</strong><span>目标比例</span><strong>点差基数S × 12%</strong><span>黄金每手费率</span><strong>$4</strong></div></div></div>`+field('与旧代理返佣的关系','mode','待业务确认。活动专属模式只针对纳入活动计奖的交易；非活动交易沿用原规则。',['活动专属模式','叠加模式'])+notice(cfg.mode==='叠加模式'?'叠加模式需核验旧代理计算基数与费率，48.48%不包含旧代理佣金。':'活动专属模式为设计建议，尚未获得业务确认。不得追溯调整已成立的代理收益。',true);
if(configTab===4)b=`<div class="titlebar"><div><h3>品种费率表</h3><div class="muted">每手金额按 ROUND_HALF_UP 取整；S不取整。以下基数仍需生产核验。</div></div><button onclick="toast('已按6%、9%、12%、18%、24%、30%、6%、12%重新生成示例费率');configBody()">按比例生成费率</button></div>`+table(['品种','S / USD','L1','L2','L3','L4','L5','L6','本人','邀请','最高占比','状态'],products.map(([sym,s])=>[sym,s,...ratios.map(r=>round(s*r)),((round(s*.30)+round(s*.06)+round(s*.12))/s*100).toFixed(2)+'%',tag(sym==='XAUCNY'?'待核验':'候选品种')]))+`<div class="card" style="background:#f8faff;margin-top:20px"><h3>奖励试算</h3><div class="filters"><select id="calcSymbol" onchange="calc()">${products.map(p=>`<option>${p[0]}</option>`).join('')}</select><select id="calcTier" onchange="calc()">${[1,2,3,4,5,6].map(i=>`<option value="${i-1}" ${i===6?'selected':''}>L${i}</option>`).join('')}</select><input id="calcLots" type="number" min="0.01" step="0.01" value="1" oninput="calc()"><span class="muted">有效标准手</span></div><div id="calcOut"></div></div>`;
if(configTab===5)b=`<div class="grid2">${field('结算周期','period','设计建议：UTC+8日结，次日现金发放。需业务确认。',['T+1日09:00前'])}<div class="field"><label>计奖精度</label><input disabled value="整数每手费率 × 实际有效手数"><p>使用十进制定点数，周期汇总后四舍五入到美分；不把每笔小数手奖励取整到美元。</p></div></div><h3>版本与发布校验</h3>`+table(['检查项','当前结果'],[['活动配置完整性',tag('可预检')],['品种基数与标准手映射',tag('待业务确认')],['旧代理叠加 / 首存补贴 / 起算点 / 提现规则',tag('待业务确认')],['幂等、迟到成交、冲正、退款与资金对账','上线前由研发和测试验收']])+notice('生产发布失败时保留草稿，展示字段级错误。本原型不提供线上发布能力。');$('#configbody').innerHTML=b;if(configTab===4)calc()}
function calc(){const s=products.find(p=>p[0]===$('#calcSymbol').value)[1],v=Number($('#calcLots').value),i=Number($('#calcTier').value);if(!Number.isFinite(v)||v<=0){$('#calcOut').innerHTML=notice('请输入大于0的有效手数',true);return}let a=round(s*ratios[i])*v,b=round(s*.06)*v,c=round(s*.12)*v;$('#calcOut').innerHTML=`<div class="chips"><span class="chip">首充 $${fmt(a)}</span><span class="chip">本人 $${fmt(b)}</span><span class="chip">邀请 $${fmt(c)}</span><span class="chip">合计 $${fmt(a+b+c)} · ${((a+b+c)/(s*v)*100).toFixed(2)}%</span></div><p class="muted">假设三项均有效且赠金池充足。首充实际解锁不得超过剩余额度；XAUCNY核验前不启用。</p>`}
function saveConfig(){if(!cfg.name.trim()||!cfg.start||!cfg.end||cfg.start>cfg.end||Number(cfg.threshold)<100){toast('请填写活动名称、有效报名日期和不低于100美元的门槛');return}saved=true;toast('草稿已保存至本页内存，尚未发布')}
function previewRelease(){if(!saved){toast('请先保存草稿');return}$('#layer').innerHTML=`<div class="overlay"><div class="modal"><h2>发布预检</h2>${notice('当前仍有业务待确认项，生产发布应阻断。',true)}<p class="muted">代理叠加、补贴口径、共同起算点、提现规则与品种基数尚待核验。本地原型可模拟生成新版本，不改变真实业务。</p><div class="actions"><button onclick="closeLayer()">返回草稿</button><button class="primary" onclick="version='v1.4 · 演示';closeLayer();toast('已模拟生成版本快照');openConfig(5)">模拟版本生成</button></div></div></div>`}
function userList(){ $('#app').innerHTML=title('活动参与用户','从首存资格到赠金释放，查看每一位用户的完整权益')+notice('额度关系：初始赠金池 = 已确认解锁 + 剩余待解锁 + 失效额度。已确认解锁包含待到账金额。')+`<div class="card"><div class="filters"><input id="uq" placeholder="用户ID / 交易账户"><select id="us"><option>全部状态</option><option>参与中</option><option>额度用完</option><option>退出</option></select><button class="primary" onclick="userRows()">查询</button><button onclick="userList()">重置</button></div><div id="urows"></div></div>`;userRows()}
function userRows(){let q=$('#uq').value,s=$('#us').value;$('#urows').innerHTML=table(['用户 / 账户','首存 / 档位','赠金池','已确认解锁','待到账¹','剩余待解锁','状态','操作'],users.filter(u=>(u.id+u.account).includes(q)&&(s==='全部状态'||u.state===s)).map(u=>[`<strong>${u.id}</strong><small>${u.account}</small>`,`$${fmt(u.deposit)}<small>${u.tier}</small>`,'$'+fmt(u.pool),'$'+fmt(u.unlocked),'$'+fmt(u.pending),'$'+fmt(u.remain),tag(u.state),`<button class="link" onclick="userDetail('${u.id}')">权益详情</button>`]))+`<div class="notefoot">¹ 待到账为已确认解锁的子集，不重复加总。列表为模拟快照，不与奖励样例明细全量对账。</div>`}
let detailUser='DEMO1001';function userDetail(id,t=0){detailUser=id;let u=users.find(x=>x.id===id);$('#layer').innerHTML=`<div class="overlay"><section class="drawer"><div class="titlebar"><div><h1>${u.id}</h1><div class="muted">${u.account} · ${u.tier} · ${u.state}</div></div><button onclick="closeLayer()">关闭 ×</button></div><div class="card"><div class="sectiontabs">${['权益概览','赠金池流水','交易奖励','操作记录'].map((n,i)=>`<button class="${t===i?'sel':''}" onclick="userDetail('${id}',${i})">${n}</button>`).join('')}</div><div id="detailbody"></div></div></section></div>`;let b='';if(t===0)b=`<div class="metrics" style="grid-template-columns:1fr 1fr">${metric('初始赠金','$'+fmt(u.pool),'200%首存，最高20,000美元')}${metric('剩余待解锁','$'+fmt(u.remain),'不可作为保证金')}</div><div class="kv"><span>符合条件首存</span><strong>$${fmt(u.deposit)}</strong><span>资格激活时间</span><span>${u.start}</span><span>直接邀请人</span><span>${u.inviter}</span><span>本人奖励截止</span><span>${u.d30}</span><span>邀请奖励截止</span><span>${u.d60}</span><span>首充解锁截止</span><span>${u.d90}</span><span>已确认解锁</span><span>$${fmt(u.unlocked)}（待到账 $${fmt(u.pending)}）</span><span>失效额度</span><span>$${fmt(u.expired)}</span></div>`+notice('各窗口左闭右开；截止时刻平仓不计对应奖励。退出首充不自动取消两类邀请奖励。');if(t===1)b=table(['事件','增加额度','解锁 / 失效','余额'],[['首存生成赠金','$'+fmt(u.pool),'—','$'+fmt(u.pool)],['累计有效交易解锁','—','$'+fmt(u.unlocked),'$'+fmt(u.pool-u.unlocked)],...(u.expired?[['提现成功取消','—','$'+fmt(u.expired),'$0.00']]:[])])+`<p class="muted">原型使用汇总流水。正式版本逐事件展示时间、来源成交或入金单、操作前后余额。</p>`;if(t===2)b=table(['成交','奖励类型','应发','状态'],rewards.filter(r=>r.trader===id).map(r=>[r.deal,r.type,'$'+fmt(r.amount),tag(r.state)]));if(t===3)b=table(['时间','事件','执行方'],[[u.start,'首存资格激活，锁定v1.3','系统'],[u.start,'建立首充赠金池','系统'],...(u.expired?[['2026-12-05 15:00','按演示退出规则取消剩余额度','系统']]:[])])+notice('人工改账、补发和冲正需要权限、原因及审计。本原型不执行资金操作。');$('#detailbody').innerHTML=b}
function rewardList(){ $('#app').innerHTML=title('活动奖励明细','同一笔成交分别记录三类奖励，收款人与交易者明确区分',`<button onclick="exportRewards()">导出当前结果</button>`)+`<div class="card"><div class="filters"><input id="rq" placeholder="成交编号 / 用户ID"><select id="rt"><option>全部奖励</option><option>首充解锁</option><option>本人奖励</option><option>邀请奖励</option></select><select id="rs"><option>全部状态</option><option>待结算</option><option>已到账</option><option>发放失败</option><option>不计奖</option></select><button class="primary" onclick="rewardRows()">查询</button><button onclick="rewardList()">重置</button></div><div id="rrows"></div></div>`;rewardRows()}
function filteredRewards(){let q=$('#rq').value,t=$('#rt').value,s=$('#rs').value;return rewards.filter(r=>(r.deal+r.trader+r.payee).includes(q)&&(t==='全部奖励'||r.type===t)&&(s==='全部状态'||r.state===s))}function rewardRows(){ $('#rrows').innerHTML=table(['成交 / 奖励编号','奖励类型','交易者 → 收款人','品种 / 手数','持仓','费率 / 手','应发','状态','操作'],filteredRewards().map(r=>[`${r.deal}<small>${r.id}</small>`,r.type,`${r.trader}<small>→ ${r.payee}</small>`,`${r.symbol}<small>${r.lots} 手</small>`,r.seconds+'秒','$'+r.rate,'$'+fmt(r.amount),tag(r.state),`<button class="link" onclick="rewardDetail('${r.id}')">明细</button>`]))}
function rewardDetail(id){let r=rewards.find(r=>r.id===id);$('#layer').innerHTML=`<div class="overlay"><div class="modal"><h2>奖励计算明细 · ${r.id}</h2><div class="kv"><span>源成交</span><strong>${r.deal}</strong><span>收款人</span><span>${r.payee}</span><span>规则版本</span><span>v1.3（资格激活时锁定）</span><span>计算公式</span><span>${r.lots}手 × $${r.rate}/手</span><span>计奖结果</span><strong>$${fmt(r.amount)} · ${r.state}</strong><span>判断原因</span><span>${r.reason}</span></div>${notice('业务唯一键：交易服务器＋账户＋成交编号＋奖励类型；重试不新增第二笔奖励。')}<button class="primary" onclick="closeLayer()">知道了</button></div></div>`}
function exportRewards(){let data=[['奖励编号','成交编号','类型','交易者','收款人','品种','手数','金额USD','状态'],...filteredRewards().map(r=>[r.id,r.deal,r.type,r.trader,r.payee,r.symbol,r.lots,r.amount,r.state])];let blob=new Blob(['\ufeff'+data.map(row=>row.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Mullet_模拟奖励明细.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('已导出筛选后的模拟数据')}
function settlement(){ $('#app').innerHTML=title('活动结算','按批次核对已确认奖励，区分到账成功、失败和待处理')+notice('演示批次包含DEMO-T001的三项奖励，共16美元。下方操作仅模拟到账状态，不连接支付或钱包。')+`<div class="metrics">${metric('批次应发','$16.00','3笔奖励 / 2名收款人')}${metric('成功到账',settled?'$16.00':'$12.00',settled?'3笔成功':'2笔成功')}${metric('失败待处理',settled?'$0.00':'$4.00',settled?'已完成重试':'1笔邀请奖励')}${metric('应发未到账差额',settled?'$0.00':'$4.00','应发金额 − 成功金额')}</div><div class="card"><h3>结算批次</h3>${table(['批次','交易归属日','应发','成功','失败','状态','操作'],[['DEMO-B20261206','2026-12-06','$16.00',settled?'$16.00':'$12.00',settled?'$0.00':'$4.00',tag(settled?'成功':'部分失败'),`<button class="link" onclick="batchDetail()">查看批次</button><button class="link" ${settled?'disabled':''} onclick="retry()">模拟失败重试</button>`]])}</div><div class="card"><h3>处理规则</h3><div class="steps"><div class="step">核对源交易与资格</div><div class="step">确认应发与池扣减</div><div class="step">现金到账并记录流水</div><div class="step">差额核对与失败重试</div></div><div class="muted">重复回调不能重复发钱；冲正保留原记录，新增关联调整流水。暂停结算不删除已确认奖励。</div></div>`}
function batchDetail(){$('#layer').innerHTML=`<div class="overlay"><div class="modal"><h2>DEMO-B20261206</h2>${table(['奖励','金额','结果'],[['R001 首充解锁','$10.00','成功'],['R002 本人奖励','$2.00','成功'],['R003 邀请奖励','$4.00',settled?'成功':'模拟钱包服务超时']])}<p class="muted">此批次为重试流程样例；成功时同步更新三条样例奖励状态。</p><button onclick="closeLayer()">关闭</button></div></div>`}
function retry(){confirmBox('模拟重试失败奖励','仅重试R003的4美元。原型将同步把此批次三条奖励标记为已到账，成功项不重复发放。',()=>{settled=true;rewards.slice(0,3).forEach(r=>r.state='已到账');settlement();toast('模拟重试完成，批次差额为0')})}
function stats(){ $('#app').innerHTML=title('活动统计','按同一数据范围观察赠金承诺、确认奖励与现金支出')+notice('以下为固定分析样本：黄金L6、有效交易100手、前30天三项均有效、赠金池充足；不与参与用户快照混合统计。')+`<div class="metrics">${metric('对应点差金额','$3,300.00','100手 × 33美元')}${metric('活动确认奖励','$1,600.00','首充1,000 + 本人200 + 邀请400')}${metric('活动奖励占比','48.48%','未计其他奖励或成本')}${metric('点差剩余','$1,700.00','51.52%，不是净利润')}</div><div class="split"><div class="card"><h3>三项奖励构成</h3>${[['首充解锁',1000,62.5],['本人奖励',200,12.5],['邀请奖励',400,25]].map(([n,v,w])=>`<div class="chartrow"><span>${n}</span><div class="bar"><i style="width:${w}%"></i></div><strong>$${fmt(v)}</strong></div>`).join('')}<div class="notefoot">条形长度为该奖励占活动总奖励的比例。</div></div><div class="card"><h3>阶段成本 · 黄金最高档</h3>${table(['阶段','每手支出','占点差'],[['前30天','$16','48.48%'],['满30至满60天前','$14','42.42%'],['满60至满90天前','$10','30.30%']])}<div class="muted">按共同起算建议口径；赠金池耗尽后不再计算首充解锁。</div></div></div><div class="card"><h3>生产统计需提供</h3><div class="chips">${['参与转化','首存档位分布','有效交易手数','解锁率','待到账与已到账','失效额度','叠加代理费用','实际点差收入','按品种及版本筛选'].map(x=>`<span class="chip">${x}</span>`).join('')}</div></div>`}

function activity(id){return catalog.find(a=>a.id===id)}function sum(rs){return rs.reduce((n,r)=>n+r.amount,0)}function money(n){return '$'+fmt(n)}function unique(items){return new Set(items).size}function inRange(d,q){return !!d&&d>=q.from&&d<=q.to}function validReward(r){return r.state!=='不计奖'}

function drill(p,id){let source=queryFor(page);queries[p]={...queryFor(p),from:source.from,to:source.to,ids:[id],type:'全部类型',state:'全部活动状态',text:'',rowState:'全部记录状态',rewardType:'全部奖励'};go(p)}

function filters(p,extra=''){let q=queryFor(p);return `<div class="filters unified"><div><label>活动类型</label><select id="fType">${['全部类型',...new Set(catalog.map(a=>a.type))].map(x=>`<option ${q.type===x?'selected':''}>${x}</option>`).join('')}</select></div><div><label>活动名称</label><button onclick="activityPicker('${p}')">${q.ids.length?`已选择 ${q.ids.length} 个活动`:'全部活动'} ▾</button></div><div><label>活动状态</label><select id="fState">${['全部活动状态','开放参与','停止新增参与','已结束','草稿'].map(x=>`<option ${q.state===x?'selected':''}>${x}</option>`).join('')}</select></div><div><label>${p==='users'?'参与时间':p==='settlement'?'批次日期':p==='rewards'?'记录时间':'统计时间'}</label><input id="fFrom" type="date" value="${q.from}"> <span class="muted">至</span> <input id="fTo" type="date" value="${q.to}"></div>${extra}<div><label>&nbsp;</label><button class="primary" onclick="applyQuery('${p}')">查询</button> <button onclick="resetQuery('${p}')">重置</button></div></div><div class="filterchips"><span>当前范围：</span>${selectedActivities(p).length?selectedActivities(p).map(a=>`<span class="chip">${esc(a.name)}</span>`).join(''):'无匹配活动'}<span class="muted">${q.from} — ${q.to}</span></div>`}

function activities(){let q=queryFor('activities');let rows=selectedActivities('activities').filter(a=>(a.name+a.id).includes(q.text)&&a.start<=q.to&&a.end>=q.from);$('#app').innerHTML=title('活动管理','统一管理不同活动模板；规则配置按活动类型区分',`<button class="primary" onclick="createTemplate()">＋ 新建活动</button>`)+notice('活动管理按报名窗口与所选日期是否相交筛选；其他页面按各自事件时间筛选。活动展示入口继续使用原“消息管理 → 活动”。')+`<div class="card">${filters('activities',recordFilters('activities',null))}${table(['活动名称 / ID','活动类型','报名窗口','状态','版本','操作'],rows.map(a=>[activityCell(a.id),a.type,`${a.start}<br>${a.end}`,tag(a.state),a.version,`<button class="link" onclick="configureActivity('${a.id}')">配置</button><button class="link" onclick="drill('users','${a.id}')">参与用户</button><button class="link" onclick="drill('stats','${a.id}');showActivityData('${a.id}')">数据</button><button class="link" onclick="toggleActivity('${a.id}')">${a.state==='开放参与'?'停止新增':'状态说明'}</button>`]))}</div>`}

function toggleActivity(id){let a=activity(id);if(a.state!=='开放参与'){toast('该活动当前'+a.state+'；本原型仅演示停止新增参与');return}confirmBox('停止新增参与',`${a.name}将停止新用户报名。已有权益和待到账奖励不受影响。`,()=>{a.state='停止新增参与';activities();toast('已模拟停止新增参与')})}
function userList(){let q=queryFor('users'),ids=selectedIds('users');let rows=memberships.filter(m=>ids.includes(m.activity)&&inRange(m.joined,q)&&(m.user+m.activity).includes(q.text)&&(q.rowState==='全部记录状态'||m.state===q.rowState));$('#app').innerHTML=title('活动参与用户','一行代表一个用户在一个活动中的参与记录')+`<div class="card">${filters('users',recordFilters('users',['参与中','退出','已通过','待审核','已中奖','未中奖']))}<div class="legend" style="margin-bottom:18px"><span>参与记录 ${rows.length} 条</span><span>去重参与用户 ${unique(rows.map(m=>m.user))} 人</span><span>同一用户可出现在多个活动中</span></div>${table(['活动名称 / ID','用户','参与时间','参与状态','专属信息','操作'],rows.map(m=>[activityCell(m.activity),m.user,m.joined,tag(m.state),m.activity==='ACT-001'?`${m.tier} · 首存 ${money(m.deposit)}`:m.activity==='ACT-002'?m.reason:'竞猜方向：'+m.choice,`<button class="link" onclick="participantDetail('${m.activity}','${m.user}')">参与详情</button>`]))}</div>`}
function participantDetail(id,uid,t=0){let a=activity(id),m=memberships.find(x=>x.activity===id&&x.user===uid),rs=rewards.filter(r=>r.activity===id&&(r.trader===uid||r.payee===uid));let tabs=id==='ACT-001'?['权益概览','赠金池流水','奖励记录']:['参与概览','奖励记录'];$('#layer').innerHTML=`<div class="overlay"><section class="drawer"><div class="titlebar"><div><h1>${uid}</h1><div class="muted">${a.name} · ${id}</div></div><button onclick="closeLayer()">关闭 ×</button></div><div class="card"><div class="sectiontabs">${tabs.map((n,i)=>`<button class="${t===i?'sel':''}" onclick="participantDetail('${id}','${uid}',${i})">${n}</button>`).join('')}</div><div id="pdBody"></div></div></section></div>`;let b='';if(t===0){b=`<div class="kv"><span>参与状态</span><span>${tag(m.state)}</span><span>参与时间</span><span>${m.joined}</span><span>本人已确认奖励</span><strong>${money(sum(rs.filter(r=>r.payee===uid&&validReward(r))))}</strong><span>本人已到账</span><strong>${money(sum(rs.filter(r=>r.payee===uid&&r.paid)))}</strong></div>`;if(id==='ACT-001'){let dates=[30,60,90].map(days=>{let d=new Date(m.joined+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+days);return d.toISOString().slice(0,10)+' 00:00'});b+=`<div class="metrics" style="grid-template-columns:1fr 1fr">${metric('初始赠金池',money(m.pool),'首存200%，最高20,000美元')}${metric('剩余待解锁',money(m.pool-m.unlock-m.expired),'不可作保证金，不含已确认解锁')}</div><div class="kv"><span>档位 / 邀请人</span><span>${m.tier} / ${m.inviter}</span><span>本人奖励截止</span><span>${m.inviter==='—'?'无邀请资格':dates[0]}</span><span>邀请奖励截止</span><span>${m.inviter==='—'?'无邀请资格':dates[1]}</span><span>首充奖励截止</span><span>${dates[2]}</span><span>已解锁 / 失效</span><span>${money(m.unlock)} / ${money(m.expired)}</span></div>`+notice('示例以参与日00:00作为共同起算点。生产采用资格激活的精确时间；截止时刻不计奖。')}else b+=`<div class="kv"><span>${id==='ACT-002'?'申请原因':'竞猜选择'}</span><span>${m.reason||m.choice}</span><span>结果</span><span>${m.state}</span></div>`}else if(id==='ACT-001'&&t===1)b=table(['事件','金额','余额'],[['生成赠金池',money(m.pool),money(m.pool)],['交易确认解锁',money(m.unlock),money(m.pool-m.unlock)],...(m.expired?[['退出取消',money(m.expired),money(0)]]:[])]);else b=table(['来源单号','奖励类型','收款人','金额','状态'],rs.map(r=>[r.deal,r.type,r.payee,money(r.amount),tag(r.state)]));$('#pdBody').innerHTML=b}
function filteredRewards(){let q=queryFor('rewards'),ids=selectedIds('rewards');return rewards.filter(r=>ids.includes(r.activity)&&inRange(r[q.timeKey],q)&&(r.deal+r.id+r.trader+r.payee).includes(q.text)&&(q.rowState==='全部记录状态'||q.rowState===r.state)&&(q.rewardType==='全部奖励'||r.type===q.rewardType))}
function rewardList(){let rs=filteredRewards();$('#app').innerHTML=title('活动奖励明细','跨活动统一查询；按奖励唯一编号识别，不重复统计同一笔发放',`<button onclick="exportRewards()">导出筛选结果</button>`)+`<div class="card">${filters('rewards',recordFilters('rewards',['待结算','已到账','发放失败','不计奖'],true))}${table(['活动名称 / ID','来源 / 奖励编号','奖励类型','交易者 / 收款人','确认 / 到账日期','金额','状态','操作'],rs.map(r=>[activityCell(r.activity),`${r.deal}<small>${r.id}</small>`,r.type,`${r.trader}<small>→ ${r.payee}</small>`,`${r.confirmed}<small>${r.paid||'尚未到账'}</small>`,money(r.amount),tag(r.state),`<button class="link" onclick="rewardDetail('${r.id}')">明细</button>`]))}</div>`}
function rewardDetail(id){let r=rewards.find(x=>x.id===id);$('#layer').innerHTML=`<div class="overlay"><div class="modal"><h2>奖励明细 · ${r.id}</h2><div class="kv"><span>活动</span><strong>${activity(r.activity).name}</strong><span>来源单号</span><span>${r.deal}</span><span>奖励 / 收款人</span><span>${r.type} / ${r.payee}</span><span>金额依据</span><span>${r.rate!==undefined?`${r.lots}手 × ${money(r.rate)}/手`:'按审核或活动结果核定现金金额'}</span><span>应发金额</span><strong>${money(r.amount)}</strong><span>状态</span><span>${tag(r.state)}</span><span>判断原因</span><span>${r.reason}</span><span>结算批次</span><span>${r.batch||'无'}</span></div><button onclick="closeLayer()">关闭</button></div></div>`}
function exportRewards(){let rows=[['活动ID','活动名称','奖励编号','来源单号','奖励类型','收款人','金额USD','状态','确认日期','到账日期'],...filteredRewards().map(r=>[r.activity,activity(r.activity).name,r.id,r.deal,r.type,r.payee,r.amount,r.state,r.confirmed,r.paid||''])];downloadCsv(rows,'多活动_模拟奖励明细.csv')}
function downloadCsv(rows,name){let blob=new Blob(['\ufeff'+rows.map(row=>row.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('已导出当前筛选结果')}
function batchNumbers(b){let rs=rewards.filter(r=>r.batch===b.id);return {total:sum(rs),paid:sum(rs.filter(r=>r.paid)),failed:sum(rs.filter(r=>r.state==='发放失败')),waiting:sum(rs.filter(r=>r.state==='待结算'))}}
function settlement(){let q=queryFor('settlement'),ids=selectedIds('settlement'),bs=batches.filter(b=>ids.includes(b.activity)&&inRange(b.date,q)),nums=bs.map(batchNumbers);let total=k=>nums.reduce((n,x)=>n+x[k],0);$('#app').innerHTML=title('活动结算','多个活动共用结算查询；每条批次明确关联活动，支持追溯到奖励')+`<div class="card">${filters('settlement')}</div><div class="metrics">${metric('批次应发',money(total('total')),'按批次日期筛选')}${metric('成功到账',money(total('paid')),'同一批次的累计到账结果')}${metric('失败待处理',money(total('failed')),'只重试失败记录')}${metric('尚未结算',money(total('waiting')),'已确认，尚未执行发放')}</div><div class="card">${table(['活动名称 / ID','批次 / 日期','应发','成功','失败 / 待结算','操作'],bs.map(b=>{let n=batchNumbers(b);return [activityCell(b.activity),`${b.id}<small>${b.date}</small>`,money(n.total),money(n.paid),`${money(n.failed)} / ${money(n.waiting)}`,`<button class="link" onclick="batchDetail('${b.id}')">详情</button>${n.failed?`<button class="link" onclick="retryBatch('${b.id}')">模拟失败重试</button>`:''}`]}))}</div>`+notice('批次页按“所选批次的当前结果”展示；活动数据页的到账金额按实际到账日期统计，两者时间口径不同。')}
function batchDetail(id){let b=batches.find(x=>x.id===id),rs=rewards.filter(r=>r.batch===id);$('#layer').innerHTML=`<div class="overlay"><section class="drawer"><div class="titlebar"><div><h1>结算批次 ${id}</h1><div class="muted">${activity(b.activity).name} · ${b.date}</div></div><button onclick="closeLayer()">关闭</button></div><div class="card">${table(['奖励编号','收款人','类型','金额','状态'],rs.map(r=>[r.id,r.payee,r.type,money(r.amount),tag(r.state)]))}</div></section></div>`}
function retryBatch(id){let rs=rewards.filter(r=>r.batch===id&&r.state==='发放失败');confirmBox('模拟重试失败奖励',`${activity(batches.find(b=>b.id===id).activity).name}：仅重试${rs.length}笔，共${money(sum(rs))}，成功项不会重复发放。模拟到账日期为2026-12-17。`,()=>{rs.forEach(r=>{r.state='已到账';r.paid='2026-12-17';r.reason='模拟重试成功，已记录到账结果'});settlement();toast('模拟重试成功，活动数据同步更新')})}
function dataFor(ids,q){let ms=memberships.filter(m=>ids.includes(m.activity)&&inRange(m.joined,q));let rs=rewards.filter(r=>ids.includes(r.activity)&&validReward(r));let confirmed=rs.filter(r=>inRange(r.confirmed,q)),paid=rs.filter(r=>inRange(r.paid,q));let rewardees=[...new Set(confirmed.map(r=>r.payee))];let converted=ms.filter(m=>confirmed.some(r=>r.activity===m.activity&&r.payee===m.user));return {ms,confirmed,paid,participants:unique(ms.map(m=>m.user)),winners:rewardees.length,participationWinners:unique(converted.map(m=>m.user)),confirmedAmount:sum(confirmed),paidAmount:sum(paid),outstanding:sum(confirmed.filter(r=>!r.paid)),failed:confirmed.filter(r=>r.state==='发放失败')};}
function stats(){statsView=null;let q=queryFor('stats'),as=selectedActivities('stats'),d=dataFor(as.map(a=>a.id),q);$('#app').innerHTML=title('活动数据','所有活动统一汇总 · 按活动对比 · 下钻查看专属指标',`<button onclick="metricDefinitions()">指标口径</button><button onclick="exportStats()">导出活动汇总</button>`)+`<div class="card">${filters('stats')}</div>`+notice('演示范围：2026年12月。人数按用户ID跨活动去重；金额按唯一奖励记录累加。不同指标按各自事件时间统计，不直接混算“获奖率”。')+`<div class="metrics">${metric('去重参与人数',d.participants+' 人',d.ms.length+'条参与记录 · 按参与时间')}${metric('去重获奖人数',d.winners+' 人','按奖励确认时间，包含邀请人')}${metric('已确认奖励',money(d.confirmedAmount),'按确认日期，不含未解锁赠金')}${metric('实际到账金额',money(d.paidAmount),'按到账日期')}</div><div class="metrics">${metric('所选确认记录尚未到账',money(d.outstanding),'所选确认日期范围内的当前未到账余额')}${metric('失败待处理',money(sum(d.failed)),d.failed.length+'笔 · 所选确认记录的当前状态')}${metric('人均已到账奖励',d.paid.length?money(d.paidAmount/unique(d.paid.map(r=>r.payee))):'—','实际到账金额 ÷ 去重到账收款人数')}${metric('所选活动',as.length+' 个','独立统计各活动，不平均各行比例')}</div><div class="card"><div class="titlebar"><div><h3>活动对比列表</h3><div class="muted">勾选2个以上活动对比；点击活动名称下钻。各活动人数之和可能大于总览去重人数。</div></div><div class="actions"><select onchange="sortStats(this.value)"><option value="default">默认排序</option><option value="paid">到账金额 ↓</option><option value="people">参与人数 ↓</option></select><button id="compareBtn" onclick="compareData()">对比所选（${compared.size}）</button></div></div><div id="statsRows"></div></div>`;statsRows(as)}
function statsRows(as){let q=queryFor('stats');$('#statsRows').innerHTML=table(['选择','活动名称 / 类型','参与人数','获奖人数¹','已确认','已到账','未到账²','操作'],as.map(a=>{let d=dataFor([a.id],q);return [`<input type="checkbox" style="min-width:0" ${compared.has(a.id)?'checked':''} onchange="toggleCompare('${a.id}',this.checked)">`,`<button class="link" onclick="showActivityData('${a.id}')">${a.name}</button><small>${a.type} · ${a.id}</small>`,d.participants,d.winners,money(d.confirmedAmount),money(d.paidAmount),money(d.outstanding),`<button class="link" onclick="drill('rewards','${a.id}')">奖励明细</button>`]}))+`<div class="notefoot">¹ 获奖人数按收款人去重，可能包含未直接报名的邀请人；不能直接除以参与人数作为转化率。<br>² 未到账指所选时间内确认奖励的当前余额，不等于“同期已确认 − 同期到账”。首充待解锁额度仅在单活动详情展示。</div>`}
function sortStats(k){let as=selectedActivities('stats');if(k!=='default')as.sort((a,b)=>{let x=dataFor([a.id],queryFor('stats')),y=dataFor([b.id],queryFor('stats'));return k==='paid'?y.paidAmount-x.paidAmount:y.participants-x.participants});statsRows(as)}
function toggleCompare(id,on){on?compared.add(id):compared.delete(id);$('#compareBtn').textContent=`对比所选（${compared.size}）`}
function compareData(){let ids=[...compared].filter(id=>selectedIds('stats').includes(id));if(ids.length<2){toast('请至少勾选两个活动');return}let q=queryFor('stats'),ds=ids.map(id=>dataFor([id],q));$('#layer').innerHTML=`<div class="overlay"><section class="drawer" style="width:min(1050px,95vw)"><div class="titlebar"><div><h1>活动对比</h1><div class="muted">${q.from} — ${q.to} · 仅比较通用指标</div></div><button onclick="closeLayer()">关闭</button></div><div class="card">${table(['指标',...ids.map(id=>activity(id).name)],[['参与人数',...ds.map(d=>d.participants+'人')],['获奖收款人数',...ds.map(d=>d.winners+'人')],['已确认奖励',...ds.map(d=>money(d.confirmedAmount))],['实际到账金额',...ds.map(d=>money(d.paidAmount))],['确认记录当前未到账',...ds.map(d=>money(d.outstanding))]])}${notice('不比较赠金解锁率与竞猜中奖率。业务类型不同的专属指标，进入活动详情查看。')}</div></section></div>`}
function showActivityData(id){statsView=id;let q=queryFor('stats'),a=activity(id),d=dataFor([id],q);$('#app').innerHTML=title(a.name+' · 数据详情',`${id} / ${a.type} / ${q.from} — ${q.to}`,`<button onclick="stats()">← 返回活动数据</button><button onclick="drill('rewards','${id}')">奖励明细</button>`)+`<div class="metrics">${metric('参与人数',d.participants+'人','按参与时间')}${metric('获奖人数',d.winners+'人','按确认时间 · 收款人')}${metric('已确认',money(d.confirmedAmount),'不含未解锁额度')}${metric('已到账',money(d.paidAmount),'按到账日期')}</div>`;let b='';if(id==='ACT-001'){let ms=memberships.filter(m=>m.activity===id),pool=ms.reduce((s,m)=>s+m.pool,0),unlock=ms.reduce((s,m)=>s+m.unlock,0),expired=ms.reduce((s,m)=>s+m.expired,0);b=`<h3>首充与邀请专属指标</h3>`+notice('下列赠金池为该活动完整模拟样本的当前快照，不受上方事件日期筛选影响。')+`<div class="metrics">${metric('初始赠金池',money(pool),'承诺额度')}${metric('累计确认解锁',money(unlock),'赠金池已消耗额度')}${metric('剩余待解锁',money(pool-unlock-expired),'不能作保证金')}${metric('已失效额度',money(expired),'退出或到期取消')}</div><div class="kv"><span>累计解锁率</span><strong>${(unlock/pool*100).toFixed(2)}%</strong><span>计算方式</span><span>累计确认解锁 ÷ 初始赠金池；失效额度单独列示</span></div>`+table(['奖励类别','所选日期内已确认'],['首充解锁','本人奖励','邀请奖励'].map(t=>[t,money(sum(d.confirmed.filter(r=>r.type===t)))]));}else if(id==='ACT-002'){let passed=d.ms.filter(m=>m.state==='已通过').length,reviewed=d.ms.filter(m=>['已通过','已拒绝'].includes(m.state)).length;b=`<h3>交易补偿专属指标</h3>`+notice('以下按所选日期参与的申请批次统计当前审核结果。')+`<div class="metrics">${metric('申请人数',d.participants,'按申请参与时间')}${metric('已通过',passed,'当前审核状态')}${metric('待审核',d.ms.filter(m=>m.state==='待审核').length,'当前审核状态')}${metric('审核通过率',reviewed?(passed/reviewed*100).toFixed(2)+'%':'—','通过数 ÷ 已完成审核数')}</div>`;}else{let win=d.ms.filter(m=>m.state==='已中奖').length;b=`<h3>竞猜专属指标</h3>`+notice('以下按所选日期参与的用户批次统计竞猜结果；本样例每用户仅参与一次。')+`<div class="metrics">${metric('竞猜参与人数',d.participants,'按参与时间')}${metric('中奖人数',win,'所选参与批次当前结果')}${metric('中奖率',d.participants?(win/d.participants*100).toFixed(2)+'%':'—','中奖参与人数 ÷ 参与人数')}${metric('已支付奖金',money(d.paidAmount),'按到账日期')}</div>`;}$('#app').innerHTML+=`<div class="card">${b}</div><div class="card"><h3>活动内用户</h3>${table(['用户','参与日期','状态','操作'],d.ms.map(m=>[m.user,m.joined,tag(m.state),`<button class="link" onclick="participantDetail('${id}','${m.user}')">参与详情</button>`]))}</div>`;window.scrollTo(0,0)}
function metricDefinitions(){$('#layer').innerHTML=`<div class="overlay"><section class="drawer"><div class="titlebar"><h1>指标口径</h1><button onclick="closeLayer()">关闭</button></div><div class="card">${table(['指标','定义'],[['参与人数','所选活动内按参与时间筛选，再按用户ID去重'],['获奖人数','按确认时间筛选有效奖励，再按收款人去重，含邀请人'],['已确认奖励','按确认时间累计有效奖励金额，奖励ID唯一'],['实际到账金额','按到账时间累计现金，未到账不计入'],['当前未到账','所选确认记录中当前尚未成功到账的金额'],['人均已到账','同期到账金额 ÷ 同期去重到账收款人数'],['待解锁赠金','只计入承诺额度，不计入确认奖励或已到账'],['跨活动去重','人数不能相加；一个奖励ID只属于一个归属活动']])}<p class="muted">本原型不展示跨事件口径的汇总获奖率。各活动专属转化率按同一参与批次的分子、分母计算。</p></div></section></div>`}
function exportStats(){let q=queryFor('stats');downloadCsv([['活动ID','活动名称','参与人数','获奖人数','已确认USD','已到账USD','当前未到账USD'],...selectedActivities('stats').map(a=>{let d=dataFor([a.id],q);return[a.id,a.name,d.participants,d.winners,d.confirmedAmount,d.paidAmount,d.outstanding]})],'多活动_数据汇总.csv')}

go('activities');
</script><script src="/assets/proto-home.js"></script>
</body></html>
