der:0;border-bottom:2px solid transparent;border-radius:0;padding:13px 2px;color:#8290a2;white-space:nowrap}.sectiontabs button.sel{color:var(--blue);border-bottom-color:var(--blue)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:28px}.field{margin-bottom:23px}.field label{display:block;font-size:12px;color:#5e6d82;margin-bottom:9px}.field input,.field select{width:100%}.field p{font-size:11px;color:#929eaf;line-height:1.8;margin:7px 0}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:7px 12px;background:#f4f7fc;border:1px solid #e1e8f3;border-radius:4px;color:#587096;font-size:12px}.sticky{position:sticky;bottom:0;padding:15px 22px;background:#ffffffee;border:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;border-radius:6px;backdrop-filter:blur(8px)}.steps{display:flex;gap:12px;margin:16px 0}.step{padding:15px;background:#f5f8fe;flex:1;border-radius:5px;font-size:12px;color:#6380aa}.num{font-variant-numeric:tabular-nums}.bar{height:7px;background:#edf1f7;border-radius:5px;overflow:hidden;margin-top:9px}.bar i{display:block;background:#6090ed;height:100%;border-radius:5px}.overlay{position:fixed;inset:0;background:#15243c55;z-index:10;display:flex;justify-content:flex-end}.drawer{width:min(760px,95vw);height:100vh;background:var(--bg);overflow:auto;box-shadow:-5px 0 35px #19325222;padding:26px}.modal{margin:auto;background:white;border-radius:10px;padding:28px;width:min(530px,95vw)}.modal h2{font-size:19px;margin-top:0}.kv{display:grid;grid-template-columns:130px 1fr;gap:15px;font-size:13px;margin:20px 0}.kv span:nth-child(odd){color:#8794a7}#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:12px 22px;background:#172a46;color:white;border-radius:6px;z-index:30;box-shadow:0 5px 25px #13213933;display:none}.empty{text-align:center;color:#96a1b1;padding:45px}.split{display:grid;grid-template-columns:1.4fr 1fr;gap:20px}.chartrow{display:grid;grid-template-columns:90px 1fr 80px;align-items:center;gap:16px;font-size:12px;margin:24px 0}.legend{display:flex;gap:20px;font-size:12px;color:#8390a2}.dot{display:inline-block;width:8px;height:8px;background:#5688ef;border-radius:50%;margin-right:7px}.checkbox{display:flex;align-items:center;gap:10px;margin:16px 0;font-size:13px}.checkbox input{min-width:0}.notefoot{font-size:11px;color:#98a3b2;line-height:1.8;margin-top:18px}.rateinput{width:70px;min-width:50px;padding:6px}.version{color:#98a5b8;font-size:11px}@media(max-width:1000px){aside{width:178px}main{margin-left:178px}.content{padding:20px}.metrics{grid-template-columns:repeat(2,1fr)}.grid2,.split{grid-template-columns:1fr}.titlebar{gap:15px;align-items:flex-start}}@media(max-width:650px){aside{position:static;width:100%;height:auto;padding:14px}.brand,.navgroup,.asidefoot{display:none}aside nav{display:flex;overflow:auto}.nav,.nav.sub{white-space:nowrap;padding:10px}main{margin-left:0}header{padding:12px;height:auto}.metrics{gap:8px}.content{padding:14px}.titlebar{flex-direction:column}.topright{gap:8px}}

const products=[['XAUUSD',33],['XAGUSD',280],['XAUCNY',118.06],['UKOIL',84],['USOIL',58],['US500',50.5],['JPN225',62.1],['HK50',81],['NAS100',62],['US30',61],['GER30',47.92]];const rates=[.06,.09,.12,.18,.24,.30],round=n=>Math.floor(n+.5);let tab=0,view='list',detailTab=0,search='',draft={name:'首充赠金活动',url:'',start:'2026-12-01',end:'2027-03-31',ratio:200,cap:20000,days:90,hold:60,exit:'提现成功取消剩余待解锁额度',extend:'顺延',notes:'首存赠送200%待解锁额度，最高20,000美元；完成商品与股指有效交易后逐步释放为现金。持仓须满1分钟，个人有效期90天。未释放额度不可作为保证金。'},saved=false;

function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>$('#toast').style.display='none',2400)}function tag(t){return `<span class="badge ${t==='正常'||t==='已发放'||t==='进行中'?'green':'gray'}">${t}</span>`}function note(t){return `<div class="notice">${t}</div>`}function added(){return '<span class="badge orange" style="margin-left:6px">本次调整</span>'}function table(h,rs){return `<div class="tablewrap"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rs.length?rs.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${h.length}" class="empty">暂无匹配记录</td></tr>`}</tbody></table></div>`}function title(t,action=''){return `<div class="crumb">运营管理 / 活动明细${view==='list'?'':' / '+t}</div><div class="titlebar"><h1>${t}</h1><div class="actions">${action}</div></div>`}function closeLayer(){$('#layer').innerHTML=''}
function list(){view='list';$('#app').innerHTML=title('活动明细',`<button onclick="toast('本次仅调整已有首充赠金活动，请点击该活动的编辑')">＋ 新建活动</button>`)+note('沿用原后台活动列表。点击“编辑”配置首充赠金，点击“详情”查看参与用户与发放记录。页面数据均为模拟数据。')+`<div class="card"><div class="filters"><input id="listQuery" placeholder="活动名称" value="${esc(search)}"><button class="primary" onclick="search=$('#listQuery').value;list()">查询</button><button onclick="search='';list()">重置</button></div>${table(['活动ID','活动名称','状态','参与用户量','获得奖励用户量','已产生成本','开始时间','结束时间','操作'],(!search||draft.name.includes(search))?[['DEMO-ACT-001',esc(draft.name),tag('进行中'),3,2,'10.30 USD',draft.start,draft.end,`<button class="link" onclick="edit(0)">编辑</button><button class="link" onclick="details(0)">详情</button>`]]:[])}</div><div class="notefoot">本次聚焦首充赠金；不新增活动数据菜单、结算中心或多活动管理层级。其他活动继续使用原功能。</div>`}
function bind(k,v){draft[k]=v;saved=false}function input(k,type='text'){return `<input type="${type}" value="${esc(draft[k])}" onchange="bind('${k}',this.value)">`}function field(n,content,help=''){return `<div class="field"><label>${n}</label>${content}${help?`<p>${help}</p>`:''}</div>`}
function edit(t=0){view='edit';tab=t;$('#app').innerHTML=title('编辑 · 首充赠金活动',`<button onclick="list()">返回</button><button class="primary" onclick="save()">保存草稿</button>`)+`<div class="card"><div class="sectiontabs">${['常规','可参与用户','奖励与获取条件','其他'].map((n,i)=>`<button class="${t===i?'sel':''}" onclick="edit(${i})">${n}</button>`).join('')}</div><div id="body"></div></div>`;let b='';if(t===0)b=`<h3>活动信息</h3><div class="grid2">${field('活动名称',input('name'))}${field('活动URL',input('url'),'复用现有活动跳转配置')}${field('活动开始日期',input('start','date'))}${field('活动结束日期',input('end','date'))}${field('活动Banner','<button onclick="toast(\'原型保留原上传入口；本次不改动图片功能\')">上传图片（原功能）</button>')}${field('活动参与限量','<span class="chip">不限量（沿用原配置）</span>')}${field('活动到期后参与用户是否顺延？',`<select onchange="bind('extend',this.value)">${['顺延','不顺延'].map(x=>`<option ${draft.extend===x?'selected':''}>${x}</option>`).join('')}</select>`,'建议顺延：报名窗口关闭后，已参与用户仍走完个人90天。此项待确认。')}</div>`+note('保留原“顺延”字段，明确它与个人有效期的关系；不另外新增状态管理页面。');
if(t===1)b=`<h3>选择可参与活动用户</h3><div class="field"><label>选择用户</label><span class="chip">首入用户</span>${added()}<p>沿用原“首入用户”分类。新参与者按符合条件的首次成功入金判定，不需要运营逐个勾选。</p></div><div class="grid2">${field('最低首存','<input value="100 USD" disabled>','采用已规划的最低档门槛；首存不足100美元是否允许补存需业务确认。')}${field('参与次数','<input value="每实名身份一次，绑定一个活动交易账户" disabled>','沿用用户与账户信息；研发核实实名和重复参与校验。')}</div>`+note('入金金额基数、失败入金及补贴处理需明确；不能直接将渠道到账、用户本金和补贴混成首存金额。')+`<div class="notefoot">原有手动选择、导入及其他用户分类继续供其他活动使用，本次首充活动使用首入用户规则。</div>`;
if(t===2)b=`<h3>首充赠金规则 ${added()}</h3><div class="grid2">${field('赠金比例（%）',input('ratio','number'),'默认200%；按符合条件的首存美元金额计算。')}${field('单用户赠金上限（USD）',input('cap','number'),'默认20,000美元。')}${field('个人释放有效期（天）',input('days','number'),'默认90天；建议从符合条件的首存成功时间起算，待确认。')}${field('有效持仓（秒，含边界）',input('hold','number'),'默认60秒；恰好60秒也有效。')}</div><h3>首存档位与黄金释放费率 ${added()}</h3>${table(['档位','首存金额 D（USD）','黄金每标准手释放'],[['L1','100 ≤ D < 500','$2'],['L2','500 ≤ D < 1,000','$3'],['L3','1,000 ≤ D < 2,000','$4'],['L4','2,000 ≤ D < 5,000','$6'],['L5','5,000 ≤ D < 10,000','$8'],['L6','D ≥ 10,000','$10']])}<div class="titlebar" style="margin-top:26px"><h3>参与品种与每手释放金额 ${added()}</h3><button onclick="showRates()">查看完整费率表</button></div><p class="muted">仅商品与股指。按点差基数和六档目标比例换算后，四舍五入为整数美元每手；黄金最高10美元，其余品种按比例换算。</p><div class="card" style="background:#f8faff"><h3>释放试算</h3><div class="filters"><select id="symbol" onchange="calc()">${products.filter(p=>p[0]!=='XAUCNY').map(p=>`<option>${p[0]}</option>`).join('')}</select><select id="tier" onchange="calc()">${[1,2,3,4,5,6].map(i=>`<option value="${i-1}" ${i===6?'selected':''}>L${i}</option>`).join('')}</select><input id="lots" type="number" min="0" step="0.01" value="1" oninput="calc()"><span class="muted">计奖平仓手数（标准手）</span></div><div id="calc"></div></div>`+note('单笔释放 = 已平仓有效标准手数 × 该品种档位每手金额，且不超过剩余待释放额度。未释放赠金不可交易、不可作为保证金；已释放转为现金。');
if(t===3)b=`<h3>活动规则说明</h3><textarea style="width:100%;min-height:150px;border:1px solid #dce3ec;border-radius:5px;padding:14px;font:inherit;line-height:1.8" onchange="bind('notes',this.value)">${esc(draft.notes)}</textarea><h3 style="margin-top:25px">退出与到期处理 ${added()}</h3>${field('提现影响',`<select onchange="bind('exit',this.value)">${['提现成功取消剩余待解锁额度','提现不取消剩余待解锁额度'].map(x=>`<option ${draft.exit===x?'selected':''}>${x}</option>`).join('')}</select>`,'设计建议，待确认。已确认应发金额继续处理，不能因退出重复扣减或丢失。')}`+note('90天到期取消剩余未释放额度；历史已释放现金不因到期追回。原有“奖励停止发放”“禁止参与”操作保留，由研发明确其对未来计奖、待发奖励及恢复资格的影响。');$('#body').innerHTML=b;if(t===2)calc()}
function save(){if(!draft.name.trim()||!draft.start||!draft.end||draft.start>draft.end||['ratio','cap','days','hold'].some(k=>!Number.isFinite(Number(draft[k]))||Number(draft[k])<=0)){toast('请检查名称、日期与正数金额 / 天数 / 秒数');return}saved=true;toast('草稿已保存到当前页面内存，不修改测试后台')}
function calc(){let v=Number($('#lots').value),s=products.find(p=>p[0]===$('#symbol').value)[1],i=Number($('#tier').value);$('#calc').innerHTML=Number.isFinite(v)&&v>0?`<strong>${v}手 × $${round(s*rates[i])}/手 = $${fmt(v*round(s*rates[i]))}</strong><p class="muted">假设剩余额度充足，持仓达到${esc(draft.hold)}秒且在个人有效期内；本金和合约手数以生产核验结果为准。</p>`:'请输入大于0的平仓手数。'}
function showRates(){$('#layer').innerHTML=`<div class="overlay"><div class="drawer" style="width:min(1000px,96vw)"><div class="titlebar"><h1>首充释放费率</h1><button onclick="closeLayer()">关闭</button></div><div class="card">${table(['品种','点差基数 S','L1','L2','L3','L4','L5','L6','启用说明'],products.map(([p,s])=>[p,s,...rates.map(r=>round(s*r)),p==='XAUCNY'?'估算，核验前不启用':'上线前核验']))}<p class="muted">目标比例：6%、9%、12%、18%、24%、30%；每手金额四舍五入，点差基数不取整。</p></div></div></div>`}
function details(t=0){view='detail';detailTab=t;$('#app').innerHTML=title('活动详情',`<button onclick="list()">返回</button><button onclick="edit(2)">编辑规则</button>`)+`<div class="card"><div class="titlebar"><strong>${esc(draft.name)}</strong><span class="badge gray">模拟数据</span></div><div class="sectiontabs">${['参与/报名列表','奖励发放列表'].map((n,i)=>`<button class="${t===i?'sel':''}" onclick="details(${i})">${n}</button>`).join('')}</div><div class="filters" style="gap:30px"><span>参与/报名用户 <strong>3</strong></span><span>已获取奖励用户 <strong>2</strong></span><span>已发放奖励 <strong>10.30 USD</strong></span></div><div class="filters"><input id="userSearch" placeholder="用户ID"><button class="primary" onclick="detailRows()">查询</button><button onclick="$('#userSearch').value='';detailRows()">重置</button></div><div id="rows"></div></div>`;detailRows()}
function detailRows(){let q=$('#userSearch').value;$('#rows').innerHTML=detailTab===0?table(['用户ID','参与/报名时间','累计计奖手数','获得奖励（赠金总额）','释放奖励','剩余待释放 '+added(),'个人截止时间 '+added(),'参加活动状态','操作'],people.filter(p=>p.id.includes(q)).map(p=>[p.id,p.date,p.lots,fmt(p.pool)+' USD',fmt(p.released)+' USD',fmt(p.pool-p.released-p.expired)+' USD',p.end,tag(p.status),`<button class="link" onclick="personDetail('${p.id}')">用户明细</button><button class="link" onclick="explainExisting('奖励停止发放')">奖励停止发放</button><button class="link" onclick="explainExisting('禁止参与')">禁止参与</button>`])):table(['用户ID','发放时间','奖励发放量','到账结果','操作 '+added()],logs.filter(r=>r.id.includes(q)).map((r)=>[r.id,r.time,fmt(r.amount)+' USD',tag(r.result),`<button class="link" onclick="releaseDetail('${r.deal}')">交易明细</button>`]));$('#rows').innerHTML+=`<p class="notefoot">${detailTab===0?'累计计奖手数为参与赠金释放的平仓成交手数之和；首存金额、档位、赠金额度及交易记录在用户明细查看。':'点击交易明细查看本笔奖励关联的平仓成交。一笔发放可关联一笔或多笔成交，明细释放金额合计等于发放金额；此处汇总发放仅为演示，生产沿用原方式。'}</p>`}
function tradeTable(rows){return table(['平仓成交单号','关联持仓单号','品种','对应开仓时间','本次平仓时间','持仓时长','平仓手数','首充档位','每手释放金额','本次释放金额'],rows.map(r=>[r.deal,r.position,r.symbol,r.open,r.close,r.seconds+'秒',r.lots+'手','L'+r.level,'$'+fmt(r.rate),'$'+fmt(r.amount)]))}
function userTrades(id){let p=people.find(x=>x.id===id);return logs.filter(r=>r.id===id).flatMap(r=>r.trades.map(t=>({...t,level:p.level})))}
function personDetail(id){let p=people.find(x=>x.id===id);$('#layer').innerHTML=`<div class="overlay"><div class="drawer" style="width:min(1350px,96vw)"><div class="titlebar"><div><h1>用户明细 · ${id}</h1><span class="muted">首充赠金活动</span></div><button onclick="closeLayer()">关闭</button></div><div class="card"><h3>赠金情况</h3><div class="grid2"><div class="kv"><span>首存金额 / 档位</span><strong>$${fmt(p.deposit)} / L${p.level}</strong><span>赠金总额</span><span>$${fmt(p.pool)}</span><span>已释放</span><span>$${fmt(p.released)}</span><span>剩余待释放</span><span>$${fmt(p.pool-p.released-p.expired)}</span></div><div class="kv"><span>参与时间</span><span>${p.date}</span><span>个人有效期至</span><span>${p.end}</span><span>累计计奖手数</span><span>${p.lots}手</span><span>失效额度 / 状态</span><span>$${fmt(p.expired)} / ${p.status}</span></div></div></div><div class="card"><h3>计奖交易记录</h3>${tradeTable(userTrades(id))}<p class="muted">每行是一笔平仓成交，使用该次成交的平仓时间与手数。同一持仓分次平仓分别列示；本页只展示参与赠金释放的成交。</p></div></div></div>`}
function releaseDetail(deal){let r=logs.find(x=>x.deal===deal),p=people.find(x=>x.id===r.id);$('#layer').innerHTML=`<div class="overlay"><div class="drawer" style="width:min(1350px,96vw)"><div class="titlebar"><div><h1>交易明细</h1><span class="muted">本笔奖励关联的平仓成交</span></div><button onclick="closeLayer()">关闭</button></div><div class="card"><div class="filters" style="gap:24px"><span>用户：<strong>${r.id}</strong></span><span>发放单号：${r.deal}</span><span>发放时间：${r.time}</span><span>奖励金额：<strong>$${fmt(r.amount)}</strong></span><span>${tag(r.result)}</span></div>${tradeTable(r.trades.map(t=>({...t,level:p.level})))}<div style="text-align:right;margin-top:20px">平仓手数合计：<strong>${Number(r.trades.reduce((n,t)=>n+t.lots,0).toFixed(8))}手</strong>　 释放金额合计：<strong>$${fmt(r.trades.reduce((n,t)=>n+t.amount,0))}</strong></div><p class="muted">符合条件的成交按本次平仓手数 × 每手费率释放，金额受剩余赠金额度限制。此例展示分次平仓关联同一发放记录，生产按现有发放方式关联。</p></div></div></div>`}
function explainExisting(name){toast(name+'是原有操作；本次原型仅保留入口，不执行停发或禁止参与')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLayer()});list();
</script></body></html>
